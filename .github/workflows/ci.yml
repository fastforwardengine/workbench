name: CI

# CI runs on each push to each branch. A pull request gets the run of its
# head commit. A pull request from a fork gets no run.
on:
  push:
  workflow_dispatch:

# A new push to a branch cancels the older run on that branch. Runs on main
# always finish, so each commit on main has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Format, types, lint, and scripted tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          # The OpenTUI floor.
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scripted tier needs no key and no network.
      - run: pnpm run check
      # The npm package: the bundle builds, and the tarball holds what ships.
      - run: pnpm pack --dry-run
