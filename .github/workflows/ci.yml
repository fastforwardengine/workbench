name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, types, lint, and scripted tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          # The OpenTUI floor.
          node-version: 26.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scripted tier needs no key and no network.
      - run: pnpm run check
