# A local Workbench workstation. Run workstation/setup.sh first, then:
#
#   docker compose -f workstation/compose.yaml up -d --build --wait workstation objects
#   docker compose -f workstation/compose.yaml run --rm objects-init
#
# The second command makes the bucket and the user of the object store. It is
# a job that ends, so `up --wait` cannot include it. `make workstation` runs both.
#
# sshd listens on 127.0.0.1:2222 only. The S3 API of the object store listens
# on 127.0.0.1:9000 only. The named volumes keep the homes, the repositories of
# the git account, the library, /shared, the attachments, and the snapshots across a restart.
services:
  workstation:
    build: .
    image: workbench-workstation
    ports:
      - 127.0.0.1:2222:2222
    volumes:
      - ../.workstation:/etc/workbench:ro
      - home:/home
      - srv:/srv
      - library:/library
      - shared:/shared
      - attachments:/attachments
      # The USB devices of the machine, for lsusb and libusb. With OrbStack on
      # macOS, `orb usb attach <id>` hands a device to its Linux first.
      - /dev/bus/usb:/dev/bus/usb
    # Access to the device files of the bench, also to one attached after the
    # start: USB devices (189), cameras (81), USB-serial chips (188), CDC-ACM
    # serial ports (166), and USBTMC instruments (180). The entrypoint makes
    # the file of each camera, serial port, and instrument from /sys.
    device_cgroup_rules:
      - 'c 189:* rmw'
      - 'c 81:* rmw'
      - 'c 188:* rmw'
      - 'c 166:* rmw'
      - 'c 180:* rmw'
    restart: unless-stopped
    # Healthy once sshd accepts a connection, so `up --wait` returns then.
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/2222']
      interval: 2s
      timeout: 2s
      retries: 15

  # The object store for the snapshots: PGSTY Silo, the maintained fork of
  # MinIO (it was pgsty/minio before 2026-08-06). Workbench writes to it with
  # s3ObjectBackend. Its credentials come from .workstation/objects.env.
  objects:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    ports:
      - 127.0.0.1:9000:9000
    env_file:
      - ../.workstation/objects.env
    volumes:
      - objects:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 2s
      retries: 15

  # One job that runs after the server is healthy: it makes the bucket, and a
  # user for Workbench that can read and write that bucket alone. A second run
  # changes nothing but the secret of the user.
  objects-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      objects:
        condition: service_healthy
    env_file:
      - ../.workstation/objects.env
    volumes:
      - ./objects-policy.json:/policy.json:ro
    restart: 'no'
    entrypoint:
      - sh
      - -ec
      - |
        mcli alias set local http://objects:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null
        mcli mb --ignore-existing local/workbench-snapshots
        mcli admin policy create local workbench-objects /policy.json
        mcli admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mcli admin policy attach local workbench-objects --user "$$S3_ACCESS_KEY_ID"

volumes:
  home:
  srv:
  library:
  shared:
  attachments:
  objects:
